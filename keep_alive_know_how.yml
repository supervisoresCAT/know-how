name: Supabase Keep-Alive — Know How CAT

on:
  schedule:
    # Corre cada 4 días para estar bien dentro de la ventana de 7 días
    # antes de que el proyecto free se pause por inactividad.
    - cron: '0 9 */4 * *'
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base para mantenerla activa
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.KH_SUPABASE_URL }}/rest/v1/sectores?select=id&limit=1" \
            -H "apikey: ${{ secrets.KH_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.KH_SUPABASE_ANON_KEY }}"
